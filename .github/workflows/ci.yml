name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acres_superuser_dev_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run contracts:check
      - name: Bootstrap database roles
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: acres_superuser_dev_password
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          ACRES_MIGRATOR_PASSWORD: acres_migrator_dev_password
          ACRES_APP_PASSWORD: acres_app_dev_password
          ACRES_TEST_PASSWORD: acres_test_dev_password
        run: bash scripts/db/bootstrap-roles.sh
      - name: Apply migrations to the app database
        env:
          DATABASE_MIGRATION_URL: postgresql://acres_migrator:acres_migrator_dev_password@localhost:5432/acres?schema=public
        run: npm run prisma:migrate:deploy --workspace=@acres/server
      - name: Apply migrations to the test database
        env:
          DATABASE_MIGRATION_URL: postgresql://acres_migrator:acres_migrator_dev_password@localhost:5432/acres_test?schema=public
        run: npm run prisma:migrate:deploy --workspace=@acres/server
      - name: Harden runtime database privileges
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGPASSWORD: acres_migrator_dev_password
          POSTGRES_MIGRATOR_USER: acres_migrator
        run: bash scripts/db/harden-runtime-privileges.sh
      - name: Run server test suite
        env:
          DATABASE_URL: postgresql://acres_test:acres_test_dev_password@localhost:5432/acres_test?schema=public
        run: npm run test:server

  docker:
    name: Build and smoke-test the API image
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          load: true
          tags: acres-server:ci
      - name: Run the image
        run: |
          docker run -d --name acres-server-ci -p 3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e CLIENT_ORIGIN=http://localhost:3000 \
            -e DATABASE_URL="postgresql://acres:acres@localhost:5432/acres?schema=public" \
            -e SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd \
            -e SCHEDULER_ENABLED=false \
            acres-server:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3001/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "the container never answered /health"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs acres-server-ci
      - name: Stop container
        if: always()
        run: docker rm -f acres-server-ci
