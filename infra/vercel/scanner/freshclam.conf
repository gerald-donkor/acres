# Build-time signature fetch for the Acres Sandbox scanner image.
# Every option is documented in this ClamAV version's freshclam.conf.sample.
DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
# Whole .cvd files only, never .cld patches, so the hashes are stable.
ScriptedUpdates no
Foreground yes
LogTime yes
