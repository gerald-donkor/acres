global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: acres-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:3001

  - job_name: acres-worker
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - worker:3002

  - job_name: acres-postgres
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - postgres-exporter:9187
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: pg_up|pg_exporter_last_scrape_error|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_activity_count
        action: keep
