global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Acres does not expose a Prometheus metrics endpoint in Phase 12A. Add a
  # real, low-cardinality endpoint in application code before uncommenting.
