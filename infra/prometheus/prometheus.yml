global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: acres-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:3001
