groups:
  - name: acres_service_alerts
    rules:
      - alert: AcresApiDown
        expr: up{job="acres-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Acres API instance is down
          description: The Acres API process at api:3001 has been unreachable for more than 1 minute.

      - alert: AcresWorkerDown
        expr: up{job="acres-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Acres worker instance is down
          description: The Acres background worker process at worker:3002 has been unreachable for more than 1 minute.

      - alert: PostgresDown
        expr: pg_up{job="acres-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL database instance is down
          description: The PostgreSQL database is unreachable from postgres-exporter or failing connections for more than 1 minute.

      - alert: HighHttp5xxRate
        expr: (sum(rate(acres_http_requests_total{job="acres-api",status_class="5xx"}[5m])) / clamp_min(sum(rate(acres_http_requests_total{job="acres-api"}[5m])), 0.001)) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High HTTP 5xx error rate detected
          description: HTTP 5xx response rate has exceeded 5% of total requests over a 5-minute window.

      - alert: P95LatencyThresholdExceeded
        expr: histogram_quantile(0.95, sum(rate(acres_http_request_duration_seconds_bucket{job="acres-api"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 latency exceeded SLO threshold
          description: API p95 latency has exceeded 500ms for more than 5 minutes.

      - alert: High429Rate
        expr: (sum(rate(acres_http_429_responses_total{job="acres-api"}[5m])) / clamp_min(sum(rate(acres_http_requests_total{job="acres-api"}[5m])), 0.001)) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High HTTP 429 rate or rate-limiting spike detected
          description: Rate of HTTP 429 responses exceeds 10% of total requests, indicating potential credential stuffing or DoS attempt.

      - alert: QueueDeadLettersDetected
        expr: sum(acres_queue_jobs_total{job="acres-worker",status="failed"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Worker queue dead letters detected
          description: One or more background worker jobs have encountered fatal errors and entered dead-letter storage.

      - alert: OutboxDeliveryLag
        expr: acres_outbox_pending_events{job="acres-api"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Outbox event publication lag
          description: More than 50 outbox events have remained pending delivery for over 10 minutes.

      - alert: HighHttpConcurrency
        expr: acres_http_active_requests{job="acres-api"} > 40
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High API HTTP request concurrency
          description: More than 40 API HTTP requests have been in flight for two minutes.

      - alert: DatabaseConnectionPoolSaturation
        expr: acres_postgres_pool_requests_waiting{job="acres-api"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: API PostgreSQL connection pool saturation
          description: Requests have been waiting to acquire a connection from the API PostgreSQL pool for more than 1 minute, indicating connection starvation.
